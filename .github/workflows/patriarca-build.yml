name: CloudStream APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build CloudStream APK
        run: ./gradlew assemblePrereleaseDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/prerelease/debug -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" dist/CloudStream-PATRIARCA.apk
          ls -lh dist/CloudStream-PATRIARCA.apk

      - name: Publish direct APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f tablet-build
          git push origin -f tablet-build

          if gh release view tablet-build >/dev/null 2>&1; then
            gh release upload tablet-build dist/CloudStream-PATRIARCA.apk --clobber
          else
            gh release create tablet-build \
              dist/CloudStream-PATRIARCA.apk \
              --title "CloudStream PATRIARCA" \
              --notes "APK automática para pruebas en Android."
          fi
